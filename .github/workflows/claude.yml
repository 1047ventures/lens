# Emma asks Ask Lens for a change -> it files an issue titled "[Emma] ..." -> Claude builds it on a
# branch and opens a pull request for Sean. Sean can also reply "@claude ..." on any issue or PR.
name: Claude builds Emma's requests

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  build-request:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[Emma]')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Emma, who uses Lens every day, asked for a change through Ask Lens. Read the issue,
            then read CLAUDE.md and follow it.

            1. If the request is unclear or would need something Lens can't safely do, comment on
               the issue with one short question for Sean instead of guessing, and stop.
            2. Otherwise implement it on a new branch, matching the existing design and copy style.
            3. Regenerate the project if you added files, and make sure it compiles with the build
               command in CLAUDE.md. Fix any errors.
            4. Open a pull request with `gh pr create` that says "Closes #${{ github.event.issue.number }}".
               In the description, explain in two or three plain sentences what changed and how
               Emma will notice it, and end with one line starting "Release note:" written for Emma.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3 generate_xcodeproj.py),Bash(xcodebuild:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"

  respond:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3 generate_xcodeproj.py),Bash(xcodebuild:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"

# Emma asks Ask Lens for a change -> it files an issue titled "[Emma] ..." -> Claude builds it on a
# branch, opens a pull request, and ship-emma.yml releases it if it builds. Sean can also reply "@claude ..." on any issue or PR.
name: Claude builds Emma's requests

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  build-request:
    # Only Emma's (or Sean's) requests get built. The repo is public, so a stranger's issue is ignored.
    if: |
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Emma]') &&
      (github.event.issue.user.login == 'EmmaPion-Berlin' || github.event.issue.user.login == '1047ventures')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Emma, who uses Lens every day, asked for a change through Ask Lens. Read the issue,
            then read CLAUDE.md and follow it.

            1. If the request is unclear or would need something Lens can't safely do, comment on
               the issue with one short question for Sean instead of guessing, and stop.
            2. Otherwise implement it on a new branch, matching the existing design and copy style.
            3. Regenerate the project if you added files, and make sure it compiles with the build
               command in CLAUDE.md. Fix any errors.
            4. Open a pull request with `gh pr create` that says "Closes #${{ github.event.issue.number }}".
               In the description, explain in two or three plain sentences what changed and how
               Emma will notice it, and end with one line starting "Release note:" written for Emma.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3 generate_xcodeproj.py),Bash(xcodebuild:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
      - name: Ship it to Emma (builds again, merges and releases if it compiles)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          PR=$(gh pr list --state open --json number,body --jq ".[] | select(.body | test(\"(Closes|Fixes) #$ISSUE\\\\b\")) | .number" | head -1)
          if [ -n "$PR" ]; then gh workflow run ship-emma.yml --ref main -f pr="$PR"; fi

  respond:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'EmmaPion-Berlin')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3 generate_xcodeproj.py),Bash(xcodebuild:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"

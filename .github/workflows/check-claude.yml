# Quick check that GitHub can still use Sean's Claude sign-in. Run it from the Actions tab.
name: Check Claude sign-in
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Claude to say OK
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          ~/.local/bin/claude -p "Reply with just OK" --model claude-opus-5-5 --max-turns 1 || true
